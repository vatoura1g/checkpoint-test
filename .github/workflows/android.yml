name: Android APK

on:
  push:
    branches: [ product-studio ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Bundle pinned MobileSAM models
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/ooooooomg/mobilesam-android/a7873735900add16b4ebab745583ef8b35903c92/app/src/main/assets/mobile_sam_encoder.onnx" \
            -o app/src/main/assets/mobile_sam_encoder.onnx
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/ooooooomg/mobilesam-android/a7873735900add16b4ebab745583ef8b35903c92/app/src/main/assets/mobile_sam_decoder.onnx" \
            -o app/src/main/assets/mobile_sam_decoder.onnx
          test $(stat -c%s app/src/main/assets/mobile_sam_encoder.onnx) -gt 27000000
          test $(stat -c%s app/src/main/assets/mobile_sam_decoder.onnx) -gt 16000000
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Ghazi-v0.3-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
